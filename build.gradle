plugins {
  id 'java'
  id 'com.diffplug.spotless' version '6.25.0'
  id 'com.github.spotbugs' version '6.1.7'
  id 'org.owasp.dependencycheck' version '12.1.3'
  id 'pmd'
  id 'checkstyle'
  id 'jacoco'
}

// ─── Version Catalog ────────────────────────────────────────────────────────
ext {
  poiVersion    = '5.5.1'
  log4jVersion  = '2.25.3'
  junitVersion  = '5.11.4'
  jsoupVersion  = '1.17.2'
  gsonVersion   = '2.8.9'
  zxingVersion  = '3.5.1'
  openPdfVersion = '2.0.3'
}

// ─── Repositories ───────────────────────────────────────────────────────────
repositories {
  mavenCentral()
  flatDir { dirs 'libs' }
}

// ─── Dependencies ────────────────────────────────────────────────────────────
dependencies {
  // Appian SDK (provided at runtime by Appian server)
  compileOnly name: 'appian-plug-in-sdk-24.2-stub'
  compileOnly 'com.appian:connected-systems-core:1.2.0'
  compileOnly 'javax.servlet:javax.servlet-api:3.1.0'
  compileOnly 'javax.annotation:javax.annotation-api:1.2'
  compileOnly 'javax.persistence:javax.persistence-api:2.2'
  compileOnly 'commons-io:commons-io:2.9.0'
  compileOnly 'org.apache.commons:commons-lang3:3.8'
  compileOnly 'org.apache.commons:commons-collections4:4.4'
  compileOnly 'com.google.guava:guava:31.0.1-jre'
  compileOnly 'org.slf4j:slf4j-api:1.7.36'

  // Logging (bundled — Appian server does not provide these)
  implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
  implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
  implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"

  // Apache POI — Word document generation
  implementation "org.apache.poi:poi:${poiVersion}"
  implementation("org.apache.poi:poi-ooxml:${poiVersion}") {
    exclude group: 'org.apache.logging.log4j'
  }
  implementation "org.apache.xmlbeans:xmlbeans:5.1.1"

  // Charting
  implementation 'org.jfree:jfreechart:1.5.6'

  // HTML sanitisation
  implementation "org.jsoup:jsoup:${jsoupVersion}"

  // QR code generation
  implementation "com.google.zxing:core:${zxingVersion}"
  implementation "com.google.zxing:javase:${zxingVersion}"

  // JSON parsing
  implementation "com.google.code.gson:gson:${gsonVersion}"

  // JAXB (required on Java 11+ where it was removed from the JDK)
  implementation 'javax.xml.bind:jaxb-api:2.3.1'
  implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'
  implementation 'javax.activation:activation:1.1.1'

  // PDF export
  implementation "com.github.librepdf:openpdf:${openPdfVersion}"

  // Test
  testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
  testImplementation 'net.jqwik:jqwik:1.9.1'
  testImplementation 'org.mockito:mockito-core:5.14.2'

  // Security scanning
  spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.12.0'
}

// ─── Configuration Resolution ────────────────────────────────────────────────
// Explicit resolvable config for bundling runtime deps into the plugin JAR.
configurations {
  testImplementation.extendsFrom compileOnly

  runtimeBundle {
    canBeResolved = true
    canBeConsumed = false
    extendsFrom configurations.implementation
  }
}

// ─── Java Toolchain ──────────────────────────────────────────────────────────
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.compilerArgs << '-parameters' // retain method parameter names for reflection
}

tasks.withType(JavaExec).configureEach {
  defaultCharacterEncoding = 'UTF-8'
}

// ─── JAR ─────────────────────────────────────────────────────────────────────
jar {
  dependsOn check
  duplicatesStrategy = DuplicatesStrategy.FAIL

  into('META-INF/lib') { from configurations.runtimeBundle }
  into('src') { from sourceSets.main.allJava }

  manifest {
    attributes(
        'Spring-Context'        : '*;publish-context:=false',
        'Implementation-Title'  : 'ChartGenie',
        'Implementation-Version': project.version,
        'Built-By'              : System.getProperty('user.name'),
        'Build-Jdk'             : System.getProperty('java.version'),
        )
  }
}

// ─── Test ────────────────────────────────────────────────────────────────────
test {
  useJUnitPlatform()

  // Surface test output in the console during CI
  testLogging {
    events 'passed', 'skipped', 'failed'
    exceptionFormat 'short'
  }
}

tasks.named('test') {
  finalizedBy 'jacocoRootReport'
}

// ─── JaCoCo ──────────────────────────────────────────────────────────────────
tasks.register('jacocoRootReport', JacocoReport) {
  group = 'verification'
  description = 'Generates a JaCoCo coverage report.'
  dependsOn test

  sourceDirectories.from = files(sourceSets.main.allSource.srcDirs)
  classDirectories.from  = files(sourceSets.main.output)
  executionData.from     = fileTree(layout.buildDirectory).include('jacoco/*.exec')

  reports {
    xml.required          = true
    xml.outputLocation    = layout.buildDirectory.file('jacoco/jacoco.xml')
    html.required         = true
    csv.required          = false
  }
}

jacocoTestCoverageVerification {
  violationRules {
    rule {
      limit { minimum = 0.25 }
    }
  }
}

// ─── Checkstyle ──────────────────────────────────────────────────────────────
checkstyle {
  configFile  = rootProject.file('config/checkstyle.xml')
  ignoreFailures = false
  maxWarnings = 200
  toolVersion = '10.21.4'
}

// ─── SpotBugs ─────────────────────────────────────────────────────────────────
spotbugs {
  ignoreFailures = true
  showProgress   = true
}

spotbugsMain {
  reports {
    html { required = true; stylesheet = 'fancy-hist.xsl' }
    xml  { required = false }
  }
}

// ─── PMD ─────────────────────────────────────────────────────────────────────
pmd {
  consoleOutput  = true
  ignoreFailures = true
  ruleSets = [
    'category/java/errorprone.xml',
    'category/java/bestpractices.xml',
  ]
}

// ─── Spotless ────────────────────────────────────────────────────────────────
spotless {
  encoding 'UTF-8'

  groovyGradle {
    target '**/*.gradle'
    greclipse().configFile('.settings/greclipse.properties')
  }

  java {
    eclipse().configFile('.settings/org.eclipse.jdt.core.prefs')
    importOrder('java', 'org', 'com')
    removeUnusedImports()
  }

  format 'xml', {
    target 'src/**/*.xml'
    eclipseWtp('xml').configFile('.settings/org.eclipse.wst.xml.core.prefs')
  }

  format 'misc', {
    target '*.md'
    trimTrailingWhitespace()
    indentWithSpaces(2)
    endWithNewline()
  }
}

// ─── Dependency Vulnerability Check ─────────────────────────────────────────
// Run with: ./gradlew dependencyCheckAnalyze
dependencyCheck {
  failBuildOnCVSS = 7          // fail on HIGH or CRITICAL CVEs
  suppressionFile = 'config/owasp-suppressions.xml'
}

// ─── Version ─────────────────────────────────────────────────────────────────
version = new groovy.xml.XmlSlurper()
    .parse(file('src/main/resources/appian-plugin.xml'))
    .'plugin-info'.version
