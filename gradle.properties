# ─── Performance ─────────────────────────────────────────────────────────────
# Reuse task outputs from previous builds when inputs are unchanged
org.gradle.caching=true

# Cache the configuration phase — faster startup on repeated builds
org.gradle.configuration-cache=true

# Run independent tasks in parallel
org.gradle.parallel=true

# ─── JVM Tuning ──────────────────────────────────────────────────────────────
# Increase daemon heap — SpotBugs and POI are memory-hungry
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
